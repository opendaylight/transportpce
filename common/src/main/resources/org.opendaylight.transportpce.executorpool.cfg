# These pools run blocking work, such as device operations, outside RESTCONF request threads.
#
# Use the environment variables shown below to override the defaults. Zero or negative values
# fall back to the defaults and produce a log warning.
# Changes take effect after TransportPCE restarts. This file is required for components that use
# these pools to start.

### Shared defaults

# Threads per pool unless <pool>.threads is set (default 4).
threads=${env:TPCE_EXECUTOR_THREADS:-4}

# Tasks that can wait for a free thread unless <pool>.queueSize is set (default 64).
# Renderer, service-creation, and service-deletion have their own queue defaults below. A full
# queue rejects new work with an error.
queueSize=${env:TPCE_EXECUTOR_QUEUE_SIZE:-64}

# Seconds to wait for a component's pools to stop (default 20). After that, any remaining work
# is left to finish on its own.
shutDownTimeoutSeconds=${env:TPCE_EXECUTOR_SHUTDOWN_TIMEOUT_SECONDS:-20}

### Pool settings

# Uncomment a per-pool setting to override the shared setting above for that pool. You can
# override threads and queueSize independently. Pools with their own queue default say so below.

### OLM: get-pm

# Handles the get-pm RPC.
#olm-get-pm.threads=8
#olm-get-pm.queueSize=128

### OLM: spanloss

# The calculate-spanloss-base and calculate-spanloss-current RPCs share this pool.
# Each calculation fetches measurements from nodes in parallel, then writes the results to
# nodes in parallel. Those node calls use separate virtual threads; this pool limits concurrent
# spanloss calculations, not the number of nodes contacted by one calculation.
# If its queue is full, new spanloss RPCs fail with a resource-denied error.
#olm-spanloss.threads=8
#olm-spanloss.queueSize=128

### Renderer: service-path

# The service-path RPC's create and delete operations process the path's nodes in parallel on a
# separate fork/join pool. These settings limit concurrent RPCs and waiting RPCs, not the
# number of nodes processed at once. A full queue rejects new RPCs with a resource-denied error.
#service-path.threads=8
#service-path.queueSize=128

### Renderer: otn-service-path

# The otn-service-path RPC's create operation configures nodes in sequence; delete processes nodes
# in parallel on a separate fork/join pool. These settings limit concurrent and waiting RPCs,
# not the parallelism of a deletion. A full queue rejects new RPCs with a resource-denied error.
#otn-service-path.threads=8
#otn-service-path.queueSize=128

### Renderer: service operations

# This pool runs service implementation and deletion work from the service handler and renderer
# RPCs. Keep the queue at 1024, at least the combined queue size of service-creation and
# service-deletion below, so neither can fill the shared renderer queue on its own and have the
# other's submissions rejected. Increase it only if more services can wait; decrease it to reject
# sooner when devices are slow. To run more services at once, change renderer.threads instead.
#
# Each running service uses two separate pools for device subtasks. One handles A-Z/Z-A or per-node
# work; the other handles each deletion node's two directions. Each has 8 times renderer.threads
# threads and an unbounded queue. renderer.queueSize does not control these subtask pools.
#renderer.threads=8
renderer.queueSize=${env:TPCE_RENDERER_QUEUE_SIZE:-1024}

### Service handler: deletion

# Runs deletion steps after a renderer or PCE reply. Its queueSize also limits deletions in
# progress (default 512); further deletions are rejected.
#service-deletion.threads=8
#service-deletion.queueSize=512

### Service handler: creation

# Runs creation and feasibility steps after a PCE or renderer reply. Its queueSize also limits
# creations and feasibility checks in progress (default 512).
#service-creation.threads=8
#service-creation.queueSize=512

### Service handler: creation waiting queue

# Holds creation requests waiting for path computation. This is a separate queue;
# it is not the service-creation thread pool above. Creations compute and reserve their paths
# one at a time to avoid using the same spectrum.
# This includes service-create, temp-service-create, and recreation after reconfiguration or
# restoration. Up to 8 creations may wait for a turn by default.
# Deletes and feasibility checks do not use this queue. A create or delete request for a service
# already being operated on is rejected immediately; it does not wait here.
# Other services can be deleted concurrently.
service-create.queueSize=${env:TPCE_RPC_SERVICE_CREATE_QUEUE_SIZE:-8}

### Renderer RPC request limits

# Each limit caps requests in progress for one RPC. Further requests fail immediately instead
# of waiting in the renderer queue behind an unresponsive device. Each RPC has a default of 16;
# there is no shared setting. Use the environment variables below to change the limits.
#   service-implementation-request   service-implementation-request RPC
#   service-delete                   service-delete RPC
service-implementation-request.maxRequests=${env:TPCE_RPC_SERVICE_IMPLEMENTATION_REQUEST_LIMIT:-16}
service-delete.maxRequests=${env:TPCE_RPC_SERVICE_DELETE_REQUEST_LIMIT:-16}
