# Thread pools used to run blocking work, such as device operations, off the RESTCONF request threads.
#
# Each default can be overridden with the environment variable shown, for example in a container.
# Zero or negative values are replaced with the default, with a warning in the log.
# Changing this file restarts the components that use the pools; requests in progress on the old
# pools are cancelled.

# Number of threads in each pool without a <pool>.threads setting (default 4).
threads=${env:TPCE_EXECUTOR_THREADS:-4}

# Maximum number of tasks waiting for a free thread in each pool without a <pool>.queueSize
# setting (default 64). When the queue is full, new requests are rejected with an error.
queueSize=${env:TPCE_EXECUTOR_QUEUE_SIZE:-64}

# Maximum time in seconds to wait for a component's pools to terminate when it stops (default 20).
# Pools still running after this time are left to finish on their own.
shutDownTimeoutSeconds=${env:TPCE_EXECUTOR_SHUTDOWN_TIMEOUT_SECONDS:-20}

# Sizes of individual pools, overriding the defaults above. A pool that sets only one of its
# sizes uses the default for the other. The pools are:
#   olm-get-pm        get-pm RPC
#   olm-spanloss      calculate-spanloss-base and calculate-spanloss-current RPCs
#   service-path      service-path RPC
#   otn-service-path  otn-service-path RPC
#
#olm-get-pm.threads=8
#olm-get-pm.queueSize=128
